<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Progress</title>
    <!-- Fuente elegante de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            color: #ffffff;
            background-color: #0b0f19;
        }

        /* Contenedor del vídeo de fondo */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .video-container video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        /* Capa oscura translúcida para contraste */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(11, 15, 25, 0.85) 0%, rgba(15, 23, 42, 0.75) 100%);
            z-index: 0;
        }

        /* Contenido central */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 0 2rem;
            animation: fadeIn 1.5s ease-in-out;
        }

        .badge {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            color: #38bdf8;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        p {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            font-weight: 300;
            color: #94a3b8;
            max-width: 600px;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        /* Animación de entrada */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Fondo de Vídeo -->
    <div class="video-container">
        <!-- Reemplaza 'tu-video.mp4' por la ruta de tu vídeo local o un enlace directo -->
        <video autoplay muted loop playsinline>
            <source src="https://raw.githubusercontent.com/AstorAmor/OpenRep/9b7205195b75304bcfd078bd264718263bd07920/gemini_generated_video_098f488d.mp4" type="video/mp4">
            Tu navegador no soporta vídeos HTML5.
        </video>
    </div>

    <!-- Capa oscura -->
    <div class="overlay"></div>

    <!-- Contenido -->
    <div class="content">
        <span class="badge">Próximamente</span>
        <h1>Estamos trabajando en algo grande...</h1>
        <p>Tu salud, llevada a otro nivel...</p>
    </div>

</body>
</html>
